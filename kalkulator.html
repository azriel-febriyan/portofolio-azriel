<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      margin: 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #c9302c;
    }
    #hasil {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kalkulator Nilai</h2>
    <p>Masukkan nilai tugas, UTS, dan UAS, lalu tekan tombol Hitung.</p>

    <div class="form-group">
      <label for="tugas">Nilai Tugas</label>
      <input type="number" id="tugas" placeholder="0 - 100">
    </div>

    <div class="form-group">
      <label for="uts">Nilai UTS</label>
      <input type="number" id="uts" placeholder="0 - 100">
    </div>

    <div class="form-group">
      <label for="uas">Nilai UAS</label>
      <input type="number" id="uas" placeholder="0 - 100">
    </div>

    <button id="hitung">Hitung</button>

    <p id="hasil"></p>
  </div>
<script src="js/main.js" defer></script>
</body>
</html>
